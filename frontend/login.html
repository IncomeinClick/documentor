<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '1032196322712699');
</script>
<title>Documentor — Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 40px; width: 100%; max-width: 380px; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  .subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }
  label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
  input { width: 100%; padding: 12px; background: #111; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 15px; margin-bottom: 20px; outline: none; }
  input:focus { border-color: #4a9eff; }
  button { width: 100%; padding: 12px; background: #4a9eff; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #3a8eef; }
  .error { color: #ff4444; font-size: 13px; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1032196322712699&ev=PageView&noscript=1"/></noscript>
<div class="login-box">
  <h1>Documentor</h1>
  <p class="subtitle">Content Management</p>
  <div class="error" id="error"></div>
  <form id="form">
    <label>Email</label>
    <input type="email" id="username" placeholder="email@example.com" required>
    <label>Password</label>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Sign In</button>
  </form>
</div>
<script>
function getCookie(name) {
  const prefix = `${name}=`;
  return document.cookie.split(';').map(v => v.trim()).find(v => v.startsWith(prefix))?.slice(prefix.length) || '';
}

function setTrackingCookie(name, value) {
  document.cookie = `${name}=${value}; path=/; max-age=7776000; SameSite=Lax; Secure`;
}

function ensureFbp() {
  let fbp = getCookie('_fbp');
  if (!fbp) {
    fbp = `fb.1.${Date.now()}.${Math.floor(Math.random() * 1e16)}`;
    setTrackingCookie('_fbp', fbp);
  }
  return fbp;
}

function ensureFbc() {
  const params = new URLSearchParams(window.location.search);
  const fbclid = params.get('fbclid');
  let fbc = getCookie('_fbc');
  if (fbclid) {
    fbc = `fb.1.${Date.now()}.${fbclid}`;
    setTrackingCookie('_fbc', fbc);
  }
  return fbc;
}

function trackPageView() {
  const eventId = `pv.${Date.now()}.${Math.random().toString(36).slice(2, 12)}`;
  const fbp = ensureFbp();
  const fbc = ensureFbc();
  fbq('track', 'PageView', {}, { eventID: eventId });
  fetch('/api/tracking/meta', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      event_name: 'PageView',
      event_id: eventId,
      event_source_url: window.location.href,
      fbp,
      fbc,
    }),
    keepalive: true,
  }).catch(() => {});
}

trackPageView();

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('error');
  errEl.style.display = 'none';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('token', data.token);
      window.location.href = '/';
    } else {
      errEl.textContent = data.error || 'Login failed';
      errEl.style.display = 'block';
    }
  } catch (err) {
    errEl.textContent = 'Connection error';
    errEl.style.display = 'block';
  }
});
</script>
</body>
</html>
